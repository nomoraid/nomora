<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOMORA - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:white;font-family:Arial,sans-serif;padding:20px}
.box{max-width:420px;margin:60px auto;background:#15223a;padding:25px;border-radius:16px}
h1{color:#45c5ff;text-align:center}
p{text-align:center;color:#9aabc4}
input{width:100%;padding:14px;margin:9px 0;background:#0b1120;border:1px solid #344966;border-radius:9px;color:white}
button{width:100%;padding:14px;margin-top:12px;background:#1599df;border:0;border-radius:9px;color:white;font-weight:bold}
.switch{background:transparent;border:1px solid #1599df}
#message{font-size:13px;line-height:1.5}
.hidden{display:none}
</style>
</head>
<body>

<div class="box">
<h1>NOMORA</h1>
<p id="subtitle">Silakan masuk ke akun kamu</p>

<div id="auth">
<input id="email" type="email" placeholder="Alamat email">
<input id="password" type="password" placeholder="Password (minimal 6 karakter)">
<input id="username" class="hidden" placeholder="Nama pengguna">

<button id="mainBtn" onclick="submitAuth()">LOGIN</button>
<button class="switch" onclick="toggleMode()">Belum punya akun? Daftar</button>
</div>

<div id="dashboard" class="hidden">
<h2>Selamat datang!</h2>
<p id="userEmail"></p>
<p>Akun NOMORA berhasil terhubung.</p>
<button onclick="logout()">LOGOUT</button>
</div>

<p id="message"></p>
</div>

<script>
const SUPABASE_URL = "https://rcrpnpjyyakscwfbipez.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjcnBucGp5eWFrc2N3ZmJpcGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTkwMjksImV4cCI6MjEwOTE5NTAyOX0.6TQ9CKGl_s58Dbem2PkSTIaLNP3Hz06qASgtyyUVzlM";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let isRegister = false;

function toggleMode(){
 isRegister = !isRegister;
 document.getElementById("username").classList.toggle("hidden",!isRegister);
 document.getElementById("mainBtn").textContent = isRegister ? "DAFTAR AKUN" : "LOGIN";
 document.getElementById("subtitle").textContent = isRegister ? "Buat akun NOMORA baru" : "Silakan masuk ke akun kamu";
 document.querySelector(".switch").textContent = isRegister ? "Sudah punya akun? Login" : "Belum punya akun? Daftar";
 document.getElementById("message").textContent = "";
}

function showMessage(text){
 document.getElementById("message").textContent = text;
}

async function submitAuth(){
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;
 const username = document.getElementById("username").value.trim();

 if(!email || !password){
  showMessage("Email dan password wajib diisi.");
  return;
 }

 if(password.length < 6){
  showMessage("Password minimal 6 karakter.");
  return;
 }

 const btn = document.getElementById("mainBtn");
 btn.disabled = true;
 showMessage("Mohon tunggu...");

 try{
  if(isRegister){
   const {data,error} = await db.auth.signUp({
    email,
    password,
    options:{
     data:{username},
     emailRedirectTo:window.location.origin + window.location.pathname
    }
   });

   if(error) throw error;

   if(data.session){
    showDashboard(data.user);
   }else{
    showMessage("Pendaftaran berhasil! Silakan cek email untuk verifikasi akun, lalu login.");
   }

  }else{
   const {data,error} = await db.auth.signInWithPassword({email,password});
   if(error) throw error;
   showDashboard(data.user);
  }
 }catch(error){
  showMessage("Gagal: " + error.message);
 }finally{
  btn.disabled = false;
 }
}

function showDashboard(user){
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 document.getElementById("userEmail").textContent = user.email;
 document.getElementById("subtitle").textContent = "Akun kamu sudah masuk";
 showMessage("");
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function checkSession(){
 const {data} = await db.auth.getSession();
 if(data.session){
  showDashboard(data.session.user);
 }
}

db.auth.onAuthStateChange((event,session)=>{
 if(session) showDashboard(session.user);
});

checkSession();
</script>

</body>
</html>
